on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [clang-22, gcc-15]
    steps:
      - uses: actions/checkout@v7
      - name: Run tests under clang and GCC
        run: CC=${{ matrix.cc }} make test
